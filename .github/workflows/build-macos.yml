name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds publish a GitHub Release

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 75
    env:
      VERSION: 1.0.0
      # Optional signing. Add these repository secrets to get a signed, notarised installer:
      # DEVELOPER_ID_APP_P12, DEVELOPER_ID_INSTALLER_P12 (base64 .p12), P12_PASSWORD,
      # APP_SIGN_IDENTITY, INSTALLER_SIGN_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_APP_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}-xcode

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Configure (universal, Apple Silicon + Intel)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSPARK_BUILD_TESTS=ON \
            -DSPARK_HARDENED_RUNTIME=${{ env.HAS_SIGNING == 'true' && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build build --config Release --target Spark_All SparkFX_All SparkTests -- -quiet -jobs 3
          lipo -info "build/Spark_artefacts/Release/VST3/Spark.vst3/Contents/MacOS/Spark"
          lipo -info "build/SparkFX_artefacts/Release/AU/Spark FX.component/Contents/MacOS/Spark FX"

      - name: Package installer
        env:
          APP_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.APP_SIGN_IDENTITY || '' }}
          INSTALLER_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.INSTALLER_SIGN_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash packaging/macos/make-installer.sh "$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-${{ env.VERSION }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Offline tests (audio, randomiser, wavetables, UI snapshots)
        run: ./build/SparkTests_artefacts/Release/SparkTests "$PWD/test-output"

      - name: Validate Audio Units (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Spark_artefacts/Release/AU/Spark.component" "build/SparkFX_artefacts/Release/AU/Spark FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i spark || true
          auval -v aumu Spk1 Sprk
          auval -v aufx Spk2 Sprk

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          for p in "build/Spark_artefacts/Release/VST3/Spark.vst3" "build/SparkFX_artefacts/Release/VST3/Spark FX.vst3"; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --timeout-ms 300000 "$p"
          done

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output/*.png
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
