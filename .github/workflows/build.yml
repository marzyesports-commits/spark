name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets successful main builds publish a GitHub Release

env:
  VERSION: 1.5.0        # Spark. A "-dev" version builds and tests but doesn't publish; a version that's already released isn't re-published
  OBSDN_VERSION: 0.7.0  # OBSDN (published as a pre-release while it's in beta)

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 75
    env:
      # Optional signing. Add these repository secrets to get a signed, notarised installer:
      # DEVELOPER_ID_APP_P12, DEVELOPER_ID_INSTALLER_P12 (base64 .p12), P12_PASSWORD,
      # APP_SIGN_IDENTITY, INSTALLER_SIGN_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_APP_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}-xcode

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Configure (universal, Apple Silicon + Intel)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSPARK_BUILD_TESTS=ON \
            -DSPARK_HARDENED_RUNTIME=${{ env.HAS_SIGNING == 'true' && 'ON' || 'OFF' }} \
            -DOBSDN_GUMROAD_PRODUCT_ID="${{ vars.OBSDN_GUMROAD_PRODUCT_ID }}" \
            -DOBSDN_BUY_URL="${{ vars.OBSDN_BUY_URL }}"

      - name: Build
        run: |
          cmake --build build --config Release --target Spark_All OBSDN_All SparkTests OBSDNTests -- -quiet -jobs 3
          lipo -info "build/Spark_artefacts/Release/VST3/Spark.vst3/Contents/MacOS/Spark"
          lipo -info "build/Spark_artefacts/Release/AU/Spark.component/Contents/MacOS/Spark"
          lipo -info "build/OBSDN_artefacts/Release/VST3/OBSDN.vst3/Contents/MacOS/OBSDN"

      - name: Package installer
        env:
          APP_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.APP_SIGN_IDENTITY || '' }}
          INSTALLER_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.INSTALLER_SIGN_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          bash packaging/macos/make-installer.sh "$VERSION"
          PRODUCT=OBSDN OUT_DIR=dist-obsdn bash packaging/macos/make-installer.sh "$OBSDN_VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-mac
          path: dist/*
          if-no-files-found: error

      - name: Upload OBSDN installer
        uses: actions/upload-artifact@v4
        with:
          name: OBSDN-mac
          path: dist-obsdn/*
          if-no-files-found: error

      - name: Offline tests (audio, randomiser, wavetables, UI snapshots)
        run: |
          ./build/SparkTests_artefacts/Release/SparkTests "$PWD/test-output"
          ./build/OBSDNTests_artefacts/Release/OBSDNTests "$PWD/test-output/obsdn"

      - name: Validate Audio Units (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Spark_artefacts/Release/AU/Spark.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/OBSDN_artefacts/Release/AU/OBSDN.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i spark || true
          auval -v aumu Spk1 Sprk
          auval -v aumu Obsd Sprk

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          for p in "build/Spark_artefacts/Release/VST3/Spark.vst3" "build/OBSDN_artefacts/Release/VST3/OBSDN.vst3"; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --timeout-ms 300000 "$p"
          done

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-mac
          path: |
            test-output/*.png
            test-output/obsdn/*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}-vs2022

      - name: Configure (x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_BUILD_TESTS=ON -DOBSDN_GUMROAD_PRODUCT_ID="${{ vars.OBSDN_GUMROAD_PRODUCT_ID }}" -DOBSDN_BUY_URL="${{ vars.OBSDN_BUY_URL }}"

      - name: Build
        run: cmake --build build --config Release --target Spark_VST3 Spark_Standalone SparkTests OBSDN_VST3 OBSDN_Standalone OBSDNTests --parallel 4

      - name: Package installer
        shell: pwsh
        run: |
          function Fail($msg) { Write-Output "::error::$($msg -replace "`r?`n", ' | ')"; exit 1 }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { Fail "Inno Setup not found" }
          Get-ChildItem -Recurse build\Spark_artefacts\Release -Depth 2 | Select-Object -First 20 | ForEach-Object { Write-Output $_.FullName }
          $out = & $iscc "/DAppVersion=$env:VERSION" packaging\windows\spark.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail ("ISCC failed: " + (($out | Select-Object -Last 12) -join ' | ')) }
          $zip = "dist\Spark-$env:VERSION-Windows-plugins"
          try {
            New-Item -ItemType Directory -Force "$zip\VST3", "$zip\Apps" | Out-Null
            Copy-Item -Recurse -Force "build\Spark_artefacts\Release\VST3\Spark.vst3" "$zip\VST3"
            Copy-Item -Force "build\Spark_artefacts\Release\Standalone\Spark.exe" "$zip\Apps"
            Push-Location dist
            & 7z a -tzip "Spark-$env:VERSION-Windows-plugins.zip" "Spark-$env:VERSION-Windows-plugins" | Out-Null
            Pop-Location
            if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
            Remove-Item -Recurse -Force $zip
          } catch { Fail ("Zip failed: " + $_) }

          # OBSDN
          $out = & $iscc "/DAppVersion=$env:OBSDN_VERSION" packaging\windows\obsdn.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail ("ISCC (OBSDN) failed: " + (($out | Select-Object -Last 12) -join ' | ')) }
          New-Item -ItemType Directory -Force dist-obsdn | Out-Null
          Move-Item -Force "dist\OBSDN-$env:OBSDN_VERSION-Windows-Setup.exe" dist-obsdn
          $zip = "dist-obsdn\OBSDN-$env:OBSDN_VERSION-Windows-plugins"
          try {
            New-Item -ItemType Directory -Force "$zip\VST3", "$zip\Apps" | Out-Null
            Copy-Item -Recurse -Force "build\OBSDN_artefacts\Release\VST3\OBSDN.vst3" "$zip\VST3"
            Copy-Item -Force "build\OBSDN_artefacts\Release\Standalone\OBSDN.exe" "$zip\Apps"
            Push-Location dist-obsdn
            & 7z a -tzip "OBSDN-$env:OBSDN_VERSION-Windows-plugins.zip" "OBSDN-$env:OBSDN_VERSION-Windows-plugins" | Out-Null
            Pop-Location
            if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
            Remove-Item -Recurse -Force $zip
          } catch { Fail ("OBSDN zip failed: " + $_) }
          Get-ChildItem dist, dist-obsdn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-windows
          path: dist/*
          if-no-files-found: error

      - name: Upload OBSDN installer
        uses: actions/upload-artifact@v4
        with:
          name: OBSDN-windows
          path: dist-obsdn/*
          if-no-files-found: error

      - name: Offline tests (audio, randomiser, wavetables, UI snapshots)
        run: |
          ./build/SparkTests_artefacts/Release/SparkTests.exe "$PWD/test-output"
          ./build/OBSDNTests_artefacts/Release/OBSDNTests.exe "$PWD/test-output/obsdn"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          for p in "build/Spark_artefacts/Release/VST3/Spark.vst3" "build/OBSDN_artefacts/Release/VST3/OBSDN.vst3"; do
            ./pluginval.exe --strictness-level 8 --validate-in-process --timeout-ms 300000 "$p"
          done

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows
          path: |
            test-output/*.png
            test-output/obsdn/*.png
          if-no-files-found: ignore

  release:
    needs: [ macos, windows ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: Spark-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: OBSDN-*
          path: dist-obsdn
          merge-multiple: true

      - name: Remove retired pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SparkLead was renamed OBSDN; its old 0.1.0 pre-release and tag go
          for tag in sparklead-v0.1.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

      - name: Is this Spark version already released?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Spark $VERSION is already released; leaving it as it is."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: ${{ !contains(env.VERSION, '-dev') && (steps.existing.outputs.released != 'true' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Spark ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Spark**: a MIDI instrument with Shapeshift (rebuild a synth note from audio), a SYNTH page (filter types, sub and noise layers, Mono/Legato and glide, 2 LFOs, 4 macros and a drag-to-assign mod matrix), a built-in 7-effect rack, a library of 82 royalty-free sounds with 118 presets that use them, undo/redo, and envelopes with delay, sustain slope, live playheads and typed values.

            **Mac** (macOS 11+, Apple Silicon and Intel): download **Spark-${{ env.VERSION }}-macOS.pkg**. It isn't signed with an Apple Developer ID yet, so right-click it, choose **Open**, then **Open** again.

            **Windows** (10 and 11, 64-bit): download **Spark-${{ env.VERSION }}-Windows-Setup.exe**. It isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC": click **More info**, then **Run anyway**.

            Then in your DAW rescan plug-ins (Ableton: Settings → Plug-Ins → turn on VST3 system folders → Rescan).

            The `-plugins.zip` files hold the same plugins if you'd rather install them by hand.
          files: dist/*

      - name: Publish OBSDN beta
        if: ${{ !contains(env.OBSDN_VERSION, '-dev') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: obsdn-v${{ env.OBSDN_VERSION }}
          name: OBSDN ${{ env.OBSDN_VERSION }} (beta)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            **OBSDN** (beta): a lead synth that helps start your ideas. Pick a key, press Generate, and it gives you a riff to build on, then shape the sound around it. Strike the jade stone to roll new variations.

            **New in 0.7**
            - **Licence keys (ready for launch).** OBSDN can now be activated with a Gumroad licence key from the settings menu or the footer. Builds with a Gumroad product set run a 14-day full trial first; this beta has licensing switched off.

            **New in 0.6**
            - **Drum & bass and bass music on the RIFF page.** Six new styles: Liquid DnB, Dancefloor DnB, Neuro DnB, Jump Up, Dubstep and UK Garage. Each writes with its own rhythm (two-step bounce, half-time hits, 32nd rolls, garage shuffle) and the hint under the roll suggests a tempo.
            - **DnB & Bass presets.** Seven new leads to play them with: Reese Lead, Neuro Stab, Liquid Lead, Dancefloor Pluck, Jump Up Hoover, Dubstep Growl and Garage Organ.

            **Also new since 0.4**
            - **Write in key.** The RIFF page has a key table: the 12 notes with your scale lit and its root solid. Click a note to change key. The piano roll only lets you write lit notes.
            - **FOLD.** One click hides every note outside the scale, so the roll shows only the notes you can use. Projects remember it.
            - **A simpler RIFF page.** Generate, Mutate, Rhythm and Answer up top, key and scale underneath, and the finer settings (length, density, range, gate, swing, octave, Follow, Latch) tucked under **MORE**.
            - **A smaller download.** OBSDN now ships a focused library of 23 lead sounds (leads, wavetables, vocals, keys) instead of all 82, so the installers are about half the size.

            **RIFF**: 13 styles (Pop, Trance, Future, Drill, Afro, Chip, Anthem, Liquid DnB, Dancefloor DnB, Neuro DnB, Jump Up, Dubstep, UK Garage). Hold a key to play the riff in time with your DAW; with Follow on, other keys move it along the scale so it follows your chords. Mutate keeps the rhythm and tries new notes, Rhythm keeps the notes, Answer makes the second half reply to the first. Drag **DRAG MIDI** onto a track to keep it.

            **Sound**: up to 7-voice unison wavetable oscillators, a second oscillator, sub and breath, a filter with its own envelope, delayed vibrato, scoops, fall-offs and glide, a 7-effect rack, and 59 presets across Supersaw, Future, Drill & Trap, DnB & Bass, Afro & Amapiano, Retro 80s, Chip, Classic and Sound Design.

            **Sound design**: oscillator A can play any sound. Drop in a file, pick one of the 23 library sounds, or Shapeshift a note bounced from Serum or Vital, then play it as a wavetable (TABLE), as grains (GRAIN) or as itself (SAMPLE).

            **Modulation**: 2 LFOs (7 shapes, free or tempo-synced, per-note retrigger), 4 macros, mod wheel, aftertouch and velocity, routed through an 8-slot matrix on the MOD page. Drag a source's handle onto a facet on the ring or a knob to assign it.

            **Known limits (beta)**: a project that used one of the library sounds removed in 0.5 opens with the built-in waves instead; drop the sound back in from Spark's library if you need it. The installers aren't signed yet, hence the steps below.

            **Mac** (macOS 11+, Apple Silicon and Intel): download **OBSDN-${{ env.OBSDN_VERSION }}-macOS.pkg**, right-click it, choose **Open**, then **Open** again.

            **Windows** (10 and 11, 64-bit): download **OBSDN-${{ env.OBSDN_VERSION }}-Windows-Setup.exe**. If SmartScreen appears, click **More info**, then **Run anyway**.
          files: dist-obsdn/*
