name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets successful main builds publish a GitHub Release

env:
  VERSION: 1.5.0        # Spark. A "-dev" version builds and tests but doesn't publish; a version that's already released isn't re-published
  LEAD_VERSION: 0.1.0   # SparkLead (published as a pre-release while it's in beta)

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 75
    env:
      # Optional signing. Add these repository secrets to get a signed, notarised installer:
      # DEVELOPER_ID_APP_P12, DEVELOPER_ID_INSTALLER_P12 (base64 .p12), P12_PASSWORD,
      # APP_SIGN_IDENTITY, INSTALLER_SIGN_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_APP_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}-xcode

      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Configure (universal, Apple Silicon + Intel)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSPARK_BUILD_TESTS=ON \
            -DSPARK_HARDENED_RUNTIME=${{ env.HAS_SIGNING == 'true' && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build build --config Release --target Spark_All SparkLead_All SparkTests SparkLeadTests -- -quiet -jobs 3
          lipo -info "build/Spark_artefacts/Release/VST3/Spark.vst3/Contents/MacOS/Spark"
          lipo -info "build/Spark_artefacts/Release/AU/Spark.component/Contents/MacOS/Spark"
          lipo -info "build/SparkLead_artefacts/Release/VST3/SparkLead.vst3/Contents/MacOS/SparkLead"

      - name: Package installer
        env:
          APP_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.APP_SIGN_IDENTITY || '' }}
          INSTALLER_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.INSTALLER_SIGN_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          bash packaging/macos/make-installer.sh "$VERSION"
          PRODUCT=SparkLead OUT_DIR=dist-lead bash packaging/macos/make-installer.sh "$LEAD_VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-mac
          path: dist/*
          if-no-files-found: error

      - name: Upload SparkLead installer
        uses: actions/upload-artifact@v4
        with:
          name: SparkLead-mac
          path: dist-lead/*
          if-no-files-found: error

      - name: Offline tests (audio, randomiser, wavetables, UI snapshots)
        run: |
          ./build/SparkTests_artefacts/Release/SparkTests "$PWD/test-output"
          ./build/SparkLeadTests_artefacts/Release/SparkLeadTests "$PWD/test-output/lead"

      - name: Validate Audio Units (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Spark_artefacts/Release/AU/Spark.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/SparkLead_artefacts/Release/AU/SparkLead.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i spark || true
          auval -v aumu Spk1 Sprk
          auval -v aumu SpLd Sprk

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          for p in "build/Spark_artefacts/Release/VST3/Spark.vst3" "build/SparkLead_artefacts/Release/VST3/SparkLead.vst3"; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --timeout-ms 300000 "$p"
          done

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-mac
          path: |
            test-output/*.png
            test-output/lead/*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}-vs2022

      - name: Configure (x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSPARK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --target Spark_VST3 Spark_Standalone SparkTests SparkLead_VST3 SparkLead_Standalone SparkLeadTests --parallel 4

      - name: Package installer
        shell: pwsh
        run: |
          function Fail($msg) { Write-Output "::error::$($msg -replace "`r?`n", ' | ')"; exit 1 }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { Fail "Inno Setup not found" }
          Get-ChildItem -Recurse build\Spark_artefacts\Release -Depth 2 | Select-Object -First 20 | ForEach-Object { Write-Output $_.FullName }
          $out = & $iscc "/DAppVersion=$env:VERSION" packaging\windows\spark.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail ("ISCC failed: " + (($out | Select-Object -Last 12) -join ' | ')) }
          $zip = "dist\Spark-$env:VERSION-Windows-plugins"
          try {
            New-Item -ItemType Directory -Force "$zip\VST3", "$zip\Apps" | Out-Null
            Copy-Item -Recurse -Force "build\Spark_artefacts\Release\VST3\Spark.vst3" "$zip\VST3"
            Copy-Item -Force "build\Spark_artefacts\Release\Standalone\Spark.exe" "$zip\Apps"
            Push-Location dist
            & 7z a -tzip "Spark-$env:VERSION-Windows-plugins.zip" "Spark-$env:VERSION-Windows-plugins" | Out-Null
            Pop-Location
            if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
            Remove-Item -Recurse -Force $zip
          } catch { Fail ("Zip failed: " + $_) }

          # SparkLead
          $out = & $iscc "/DAppVersion=$env:LEAD_VERSION" packaging\windows\sparklead.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail ("ISCC (SparkLead) failed: " + (($out | Select-Object -Last 12) -join ' | ')) }
          New-Item -ItemType Directory -Force dist-lead | Out-Null
          Move-Item -Force "dist\SparkLead-$env:LEAD_VERSION-Windows-Setup.exe" dist-lead
          $zip = "dist-lead\SparkLead-$env:LEAD_VERSION-Windows-plugins"
          try {
            New-Item -ItemType Directory -Force "$zip\VST3", "$zip\Apps" | Out-Null
            Copy-Item -Recurse -Force "build\SparkLead_artefacts\Release\VST3\SparkLead.vst3" "$zip\VST3"
            Copy-Item -Force "build\SparkLead_artefacts\Release\Standalone\SparkLead.exe" "$zip\Apps"
            Push-Location dist-lead
            & 7z a -tzip "SparkLead-$env:LEAD_VERSION-Windows-plugins.zip" "SparkLead-$env:LEAD_VERSION-Windows-plugins" | Out-Null
            Pop-Location
            if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
            Remove-Item -Recurse -Force $zip
          } catch { Fail ("SparkLead zip failed: " + $_) }
          Get-ChildItem dist, dist-lead

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-windows
          path: dist/*
          if-no-files-found: error

      - name: Upload SparkLead installer
        uses: actions/upload-artifact@v4
        with:
          name: SparkLead-windows
          path: dist-lead/*
          if-no-files-found: error

      - name: Offline tests (audio, randomiser, wavetables, UI snapshots)
        run: |
          ./build/SparkTests_artefacts/Release/SparkTests.exe "$PWD/test-output"
          ./build/SparkLeadTests_artefacts/Release/SparkLeadTests.exe "$PWD/test-output/lead"

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          for p in "build/Spark_artefacts/Release/VST3/Spark.vst3" "build/SparkLead_artefacts/Release/VST3/SparkLead.vst3"; do
            ./pluginval.exe --strictness-level 8 --validate-in-process --timeout-ms 300000 "$p"
          done

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows
          path: |
            test-output/*.png
            test-output/lead/*.png
          if-no-files-found: ignore

  release:
    needs: [ macos, windows ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: Spark-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: SparkLead-*
          path: dist-lead
          merge-multiple: true

      - name: Is this Spark version already released?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Spark $VERSION is already released; leaving it as it is."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: ${{ !contains(env.VERSION, '-dev') && (steps.existing.outputs.released != 'true' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Spark ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Spark**: a MIDI instrument with Shapeshift (rebuild a synth note from audio), a SYNTH page (filter types, sub and noise layers, Mono/Legato and glide, 2 LFOs, 4 macros and a drag-to-assign mod matrix), a built-in 7-effect rack, a library of 82 royalty-free sounds with 118 presets that use them, undo/redo, and envelopes with delay, sustain slope, live playheads and typed values.

            **Mac** (macOS 11+, Apple Silicon and Intel): download **Spark-${{ env.VERSION }}-macOS.pkg**. It isn't signed with an Apple Developer ID yet, so right-click it, choose **Open**, then **Open** again.

            **Windows** (10 and 11, 64-bit): download **Spark-${{ env.VERSION }}-Windows-Setup.exe**. It isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC": click **More info**, then **Run anyway**.

            Then in your DAW rescan plug-ins (Ableton: Settings → Plug-Ins → turn on VST3 system folders → Rescan).

            The `-plugins.zip` files hold the same plugins if you'd rather install them by hand.
          files: dist/*

      - name: Publish SparkLead beta
        if: ${{ !contains(env.LEAD_VERSION, '-dev') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sparklead-v${{ env.LEAD_VERSION }}
          name: SparkLead ${{ env.LEAD_VERSION }} (beta)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            **SparkLead** (beta): a lead synth with **SparkRiff**. Up to 7-voice unison wavetable oscillators, a second oscillator, sub and breath, a filter with its own envelope, delayed vibrato, scoops, fall-offs and glide, the full Spark effects rack, and 42 presets across Supersaw, Future, Drill & Trap, Afro & Amapiano, Retro 80s, Chip and Classic.

            **SparkRiff** writes lead lines: pick a key, scale and style (Pop, Trance, Future, Drill, Afro, Chip, Anthem), press Generate, then hold a key to play the riff in time with your DAW. Mutate, Rhythm and Answer rework it; drag **DRAG MIDI** onto a track to keep it.

            **Mac** (macOS 11+, Apple Silicon and Intel): download **SparkLead-${{ env.LEAD_VERSION }}-macOS.pkg**, right-click it, choose **Open**, then **Open** again.

            **Windows** (10 and 11, 64-bit): download **SparkLead-${{ env.LEAD_VERSION }}-Windows-Setup.exe**. If SmartScreen appears, click **More info**, then **Run anyway**.
          files: dist-lead/*
